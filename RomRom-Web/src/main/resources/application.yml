spring:
  profiles:
    active: prod
  config:
    import:
      - classpath:price-prediction.prompt.yml
      - optional:classpath:chat-action-recommendation.prompt.yml
      - classpath:admin.yml

  datasource:
    hikari:
      pool-name: RomRomHikariPool
      # 블루/그린 배포로 두 인스턴스가 동시 기동되는 구간이 있어 실제 최대는 20 x 2 = 40이다.
      # PostgreSQL max_connections(기본 100) 내에서 다른 클라이언트 여유를 남긴다.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 5초 이상 반환되지 않는 커넥션을 경고로 남긴다 (OSIV 전환 판단 근거 수집)
      leak-detection-threshold: 5000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    sql-migration-suffixes: .sql
    validate-on-migrate: false # 마이그레이션 전 검증
    out-of-order: false
    repair-on-migrate: true  # 마이그레이션 전 자동 repair
    
  jpa:
    # 현재 실제 동작값을 명시한다. 기존에는 이 키가 properties.hibernate 아래에 있어
    # Spring Boot가 인식하지 못했고 기본값 true로 동작 중이었다.
    # false 전환은 미보호 LAZY 연관관계 감사가 선행돼야 해 서브프로젝트 D에서 처리한다.
    open-in-view: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 지연 로딩 N+1을 IN 절 배치 조회로 접는다
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        # IN 절 파라미터 개수를 2의 거듭제곱으로 패딩해 쿼리 플랜 캐시 히트율을 높인다
        query:
          in_clause_parameter_padding: true
  data:
    mongodb:
      auto-index-creation: true
  servlet:
    multipart:
      enabled: true # 파일 업로드 허용
      max-file-size: 200MB # 업로드 파일 최대 크기
      max-request-size: 1000MB # 요청 전체 최대 크기
      file-size-threshold: 10MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

springdoc:
  servers:
    - url: https://api.romrom.xyz
      description: main-server
    - url: https://api.test.romrom.xyz
      description: test-server
    - url: http://localhost:8080
      description: local-server

  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /docs/swagger

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

suhapilog:
  enabled: true
  github:
    base-url: "https://github.com/TEAM-ROMROM/RomRom-BE"
  storage:
    path: "./github-issues" #기본값
  default-author: "Author 누락됨!"

suh-logger:
  # 전체 로깅 활성화 여부
  enabled: true                    # true(기본값), false

  # Response Body JSON pretty print 활성화 여부
  pretty-print-json: true         # false(기본값), true

  # Response Body 로깅 최대 크기 (bytes)
  max-response-body-size: 4096     # 양의 정수 (기본값: 4096)

  # 로깅에서 제외할 URL 패턴들
  exclude-patterns:                # 문자열 배열 (기본값: 빈 배열)
#    - "/actuator"                  # Spring Boot Actuator 제외
#    - "/health"                    # Health Check 제외
#    - "/login"                     # 로그인 엔드포인트 제외 (예시)
#    - "/logout"                    # 로그아웃 엔드포인트 제외 (예시)
#    - "/auth"                      # 인증 관련 엔드포인트 제외 (예시)

  # JSON 직렬화에서 제외할 클래스들
  excluded-classes:                # 문자열 배열 (기본값: 빈 배열)
#    - "org.springframework.web.multipart.MultipartFile"
#    - "java.util.Vector"
#    - "java.io.File"

  # 마스킹 관련 설정
  masking:
    header: true                   # true(기본값), false - 민감한 헤더 마스킹 여부

  # 헤더 로깅 관련 설정
  header:
    enabled: false                 # false(기본값), true - 전역 헤더 로깅 활성화 여부
