<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title layout:fragment="title">채팅방 관리</title>
</head>
<body>
<div layout:fragment="content" class="space-y-4">

    <!-- 검색·필터 -->
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <div class="flex flex-wrap items-end gap-3">
                <fieldset class="fieldset flex-1 min-w-60">
                    <legend class="fieldset-legend">검색</legend>
                    <input type="text" id="chatRoomKeywordInput" class="input w-full" placeholder="참여자 닉네임, 물품명"/>
                </fieldset>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">상태</legend>
                    <select id="chatRoomStateSelect" class="select w-36">
                        <option value="ALL">전체</option>
                        <option value="ACTIVE">진행 중</option>
                        <option value="DELETED">삭제 대기</option>
                    </select>
                </fieldset>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">정렬</legend>
                    <select id="chatRoomSortDirectionSelect" class="select w-32">
                        <option value="DESC">최신순</option>
                        <option value="ASC">오래된순</option>
                    </select>
                </fieldset>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">페이지 크기</legend>
                    <select id="chatRoomPageSizeSelect" class="select w-24">
                        <option value="20">20개</option>
                        <option value="50">50개</option>
                        <option value="100">100개</option>
                    </select>
                </fieldset>
                <button class="btn btn-primary gap-1" onclick="searchChatRooms(0)">
                    <i data-lucide="search" class="size-4"></i> 검색
                </button>
            </div>
            <p class="text-xs text-base-content/50 mt-2">삭제 대기: 양쪽 회원이 모두 나간 방. 30일이 지나면 백업 후 정리 대상이 됩니다.</p>
        </div>
    </div>

    <!-- 목록 -->
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <div class="flex items-center justify-between">
                <h2 class="card-title text-base gap-2"><i data-lucide="messages-square" class="size-5"></i> 채팅방 목록</h2>
                <span class="badge badge-info" id="chatRoomTotalBadge">총 0개</span>
            </div>
            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>요청자 → 받은 회원</th>
                        <th>교환 물품</th>
                        <th>거래 상태</th>
                        <th>방 상태</th>
                        <th>생성일</th>
                        <th class="text-right">관리</th>
                    </tr>
                    </thead>
                    <tbody id="chatRoomTableBody"></tbody>
                </table>
            </div>
            <div id="chatRoomEmpty" class="text-center text-base-content/50 py-10 text-sm hidden">조건에 맞는 채팅방이 없습니다.</div>
            <div class="flex justify-end mt-3" id="chatRoomPager"></div>
        </div>
    </div>

    <!-- 대화 내용 모달 -->
    <dialog id="chatRoomDetailModal" class="modal">
        <div class="modal-box max-w-3xl">
            <div class="flex items-start justify-between gap-3 mb-3">
                <div>
                    <h3 class="font-bold text-lg">대화 내용</h3>
                    <p class="text-xs text-base-content/60" id="chatRoomDetailSummary">-</p>
                </div>
                <div class="flex gap-2">
                    <button class="btn btn-sm gap-1" id="chatRoomExportButton"><i data-lucide="download" class="size-4"></i> 내보내기</button>
                    <button class="btn btn-sm btn-error gap-1" id="chatRoomForceDeleteButton"><i data-lucide="trash-2" class="size-4"></i> 즉시 삭제</button>
                </div>
            </div>
            <div class="bg-base-200 rounded-box p-3 max-h-[60vh] overflow-y-auto space-y-2" id="chatRoomMessageList"></div>
            <div class="modal-action"><button class="btn" onclick="chatRoomDetailModal.close()">닫기</button></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
    </dialog>
</div>

<th:block layout:fragment="js">
    <script>
        let currentChatRoomPage = 0;

        const memberLink = member => member && member.memberId
            ? `<a class="link link-hover" href="/admin/members/${member.memberId}">${escapeHtml(member.nickname) || '익명'}</a>` : '-';
        const itemLink = item => item && item.itemId
            ? `<a class="link link-hover" href="/admin/items/${item.itemId}">${escapeHtml(item.itemName) || '-'}</a>` : '-';

        document.addEventListener('DOMContentLoaded', () => {
            // URL 필터 반영 (회원 상세 > 대화 보기)
            const urlParams = new URLSearchParams(location.search);
            if (urlParams.get('chatRoomState')) document.getElementById('chatRoomStateSelect').value = urlParams.get('chatRoomState');
            if (urlParams.get('searchKeyword')) document.getElementById('chatRoomKeywordInput').value = urlParams.get('searchKeyword');
            document.getElementById('chatRoomKeywordInput').addEventListener('keydown', keyboardEvent => {
                if (keyboardEvent.key === 'Enter') searchChatRooms(0);
            });
            searchChatRooms(0);
            if (urlParams.get('chatRoomId')) openChatRoomDetail(urlParams.get('chatRoomId'));
        });

        // ─── 목록 조회 ──────────────────────────────────────────────
        async function searchChatRooms(pageNumber) {
            currentChatRoomPage = pageNumber;
            const tableBody = document.getElementById('chatRoomTableBody');
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-6"><span class="loading loading-spinner loading-sm"></span></td></tr>';
            try {
                const chatRoomResponse = await AdminApi.call('/api/admin/chat-rooms/list', {
                    chatRoomState: document.getElementById('chatRoomStateSelect').value,
                    searchKeyword: document.getElementById('chatRoomKeywordInput').value.trim(),
                    sortDirection: document.getElementById('chatRoomSortDirectionSelect').value,
                    pageSize: document.getElementById('chatRoomPageSizeSelect').value,
                    pageNumber: pageNumber
                });
                const chatRoomPage = chatRoomResponse.chatRooms || {};
                renderChatRooms(chatRoomPage.content || [], chatRoomPage.totalElements || 0, chatRoomPage.totalPages || 1);
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-error py-6">${escapeHtml(error.message)}</td></tr>`;
            }
        }

        function renderChatRooms(chatRooms, totalElementCount, totalPageCount) {
            document.getElementById('chatRoomTotalBadge').textContent = `총 ${NumberUtils.formatNumber(totalElementCount)}개`;
            document.getElementById('chatRoomEmpty').classList.toggle('hidden', chatRooms.length > 0);
            document.getElementById('chatRoomTableBody').innerHTML = chatRooms.map(chatRoom => {
                const tradeRequest = chatRoom.tradeRequestHistory || {};
                return `
                    <tr class="hover">
                        <td>${memberLink(chatRoom.tradeSender)} → ${memberLink(chatRoom.tradeReceiver)}</td>
                        <td>${itemLink(tradeRequest.giveItem)} ↔ ${itemLink(tradeRequest.takeItem)}</td>
                        <td>${AdminBadges.html('TradeStatus', tradeRequest.tradeStatus)}</td>
                        <td>${chatRoom.deletedAt
                            ? `<span class="badge badge-sm badge-neutral">삭제 대기</span><div class="text-xs text-base-content/50">${TimeUtils.formatDateTime(chatRoom.deletedAt)}</div>`
                            : '<span class="badge badge-sm badge-info">진행 중</span>'}</td>
                        <td class="text-sm text-base-content/70">${chatRoom.createdDate ? TimeUtils.formatDateTime(chatRoom.createdDate) : '-'}</td>
                        <td class="text-right whitespace-nowrap">
                            <button class="btn btn-ghost btn-xs" onclick="openChatRoomDetail('${chatRoom.chatRoomId}')">대화 보기</button>
                            ${tradeRequest.tradeRequestHistoryId ? `<a class="btn btn-ghost btn-xs" href="/admin/trades/${tradeRequest.tradeRequestHistoryId}">거래</a>` : ''}
                        </td>
                    </tr>`;
            }).join('');
            AdminPager.render(document.getElementById('chatRoomPager'), currentChatRoomPage, totalPageCount, searchChatRooms);
            lucide.createIcons();
        }

        // ─── 대화 내용: 참여자 > 메시지 시간순 ─────────────────────────
        async function openChatRoomDetail(chatRoomId) {
            const messageList = document.getElementById('chatRoomMessageList');
            messageList.innerHTML = '<div class="text-center py-6"><span class="loading loading-spinner loading-sm"></span></div>';
            chatRoomDetailModal.showModal();
            try {
                const chatRoomDetail = await AdminApi.call('/api/admin/chat-rooms/detail', { chatRoomId: chatRoomId });
                const chatRoom = chatRoomDetail.chatRoom || {};
                const chatMessages = chatRoomDetail.chatMessages || [];
                const nicknameByMemberId = {};
                [chatRoom.tradeSender, chatRoom.tradeReceiver].filter(Boolean).forEach(member => {
                    nicknameByMemberId[member.memberId] = member.nickname || '익명';
                });
                const senderMemberId = chatRoom.tradeSender ? chatRoom.tradeSender.memberId : null;
                document.getElementById('chatRoomDetailSummary').textContent =
                    `${nicknameByMemberId[senderMemberId] || '-'} ↔ ${chatRoom.tradeReceiver ? (chatRoom.tradeReceiver.nickname || '익명') : '-'} · 메시지 ${chatMessages.length}개${chatRoom.deletedAt ? ' · 삭제 대기' : ''}`;
                messageList.innerHTML = chatMessages.length === 0
                    ? '<div class="text-center text-base-content/50 py-6 text-sm">메시지가 없습니다.</div>'
                    : chatMessages.map(chatMessage => renderChatMessage(chatMessage, nicknameByMemberId, senderMemberId)).join('');
                document.getElementById('chatRoomExportButton').onclick = () => exportChatRoom(chatRoomId);
                document.getElementById('chatRoomForceDeleteButton').onclick = () => forceDeleteChatRoom(chatRoomId);
                lucide.createIcons();
            } catch (error) {
                messageList.innerHTML = `<div class="text-center text-error py-6">${escapeHtml(error.message)}</div>`;
            }
        }

        // 메시지 1건: 요청자 왼쪽, 받은 회원 오른쪽 (이미지·위치 포함)
        function renderChatMessage(chatMessage, nicknameByMemberId, senderMemberId) {
            const isTradeSenderMessage = chatMessage.senderId === senderMemberId;
            const imageThumbnails = (chatMessage.imageUrls || [])
                .map(imageUrl => `<a href="${escapeHtml(imageUrl)}" target="_blank" rel="noopener"><img src="${escapeHtml(imageUrl)}" class="size-20 object-cover rounded" alt="이미지"/></a>`).join('');
            const locationText = chatMessage.latitude != null ? `<div class="text-xs">위치 ${chatMessage.latitude}, ${chatMessage.longitude}</div>` : '';
            const isSystemMessage = !chatMessage.senderId;
            if (isSystemMessage) {
                return `<div class="text-center text-xs text-base-content/50">${escapeHtml(chatMessage.content)} · ${chatMessage.createdDate ? TimeUtils.formatDateTime(chatMessage.createdDate) : ''}</div>`;
            }
            return `
                <div class="chat ${isTradeSenderMessage ? 'chat-start' : 'chat-end'}">
                    <div class="chat-header text-xs">
                        ${escapeHtml(nicknameByMemberId[chatMessage.senderId] || '알 수 없음')}
                        <time class="opacity-50 ml-1">${chatMessage.createdDate ? TimeUtils.formatDateTime(chatMessage.createdDate) : ''}</time>
                    </div>
                    <div class="chat-bubble ${isTradeSenderMessage ? '' : 'chat-bubble-primary'} text-sm">
                        ${chatMessage.content ? escapeHtml(chatMessage.content) : ''}
                        ${imageThumbnails ? `<div class="flex flex-wrap gap-1 mt-1">${imageThumbnails}</div>` : ''}
                        ${locationText}
                    </div>
                    <div class="chat-footer text-[10px] opacity-50">${escapeHtml(chatMessage.type || '')}</div>
                </div>`;
        }

        // 내보내기: 대화 전체 JSON gzip 다운로드
        async function exportChatRoom(chatRoomId) {
            try {
                const exportResponse = await adminFetch.post('/api/admin/chat-rooms/export', { chatRoomId: chatRoomId });
                if (!exportResponse.ok) throw new Error(`요청 실패 (${exportResponse.status})`);
                const exportBlob = await exportResponse.blob();
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = URL.createObjectURL(exportBlob);
                downloadAnchor.download = `chat-room_${chatRoomId}.json.gz`;
                downloadAnchor.click();
                URL.revokeObjectURL(downloadAnchor.href);
            } catch (error) {
                AdminApi.alertError(error, '채팅방 내보내기');
            }
        }

        // 즉시 삭제: 서버 백업 파일 생성 후 메시지·방 영구 삭제
        async function forceDeleteChatRoom(chatRoomId) {
            if (!confirm('이 채팅방을 지금 영구 삭제할까요?\n서버에 백업 파일을 만든 뒤 메시지와 방을 지웁니다. 앱에서는 다시 볼 수 없습니다.')) return;
            try {
                await AdminApi.call('/api/admin/chat-rooms/force-delete', { chatRoomId: chatRoomId });
                chatRoomDetailModal.close();
                searchChatRooms(currentChatRoomPage);
            } catch (error) {
                AdminApi.alertError(error, '채팅방 삭제');
            }
        }
    </script>
</th:block>
</body>
</html>
