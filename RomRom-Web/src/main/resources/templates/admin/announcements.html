<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title layout:fragment="title">공지사항 관리</title>
</head>
<body>
<div layout:fragment="content">
    <!-- 작성 버튼 -->
    <div class="flex justify-end mb-4">
        <button class="btn btn-primary" onclick="document.getElementById('createModal').showModal()">
            <i data-lucide="plus" class="size-4"></i>
            공지사항 작성
        </button>
    </div>

    <!-- 공지사항 목록 -->
    <div class="card bg-base-100 shadow">
        <div class="card-body">
            <div class="flex items-center justify-between mb-4">
                <h2 class="card-title text-base">공지사항 목록</h2>
                <span id="totalCount" class="badge badge-info badge-sm">-</span>
            </div>

            <!-- 로딩 -->
            <div id="loading" class="flex justify-center py-8">
                <span class="loading loading-spinner loading-lg"></span>
            </div>

            <!-- 테이블 -->
            <div class="overflow-x-auto" id="tableContainer" style="display:none;">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>제목</th>
                        <th>내용</th>
                        <th>작성일</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- 빈 목록 -->
            <div id="emptyMessage" class="flex flex-col items-center justify-center py-16 text-base-content/40" style="display:none;">
                <i data-lucide="megaphone" class="size-16 mb-4"></i>
                <h3 class="text-lg font-medium mb-2">공지사항이 없습니다</h3>
            </div>

            <!-- 페이지네이션 -->
            <div class="flex items-center justify-between mt-4" id="paginationContainer" style="display:none;">
                <span id="pageInfo" class="text-sm text-base-content/60"></span>
                <div class="join" id="pagination"></div>
            </div>
        </div>
    </div>

    <!-- 공지사항 작성 모달 -->
    <dialog id="createModal" class="modal">
        <div class="modal-box w-full max-w-2xl">
            <h3 class="text-lg font-bold mb-1">공지사항 작성</h3>
            <p class="text-sm text-base-content/60 mb-5">전체 푸시 발송을 켜면 작성 즉시 전체 사용자에게 푸시 알림이 전송됩니다.</p>
            <div class="flex flex-col gap-4">
                <fieldset class="fieldset w-full">
                    <legend class="fieldset-legend">제목</legend>
                    <input type="text" id="inputTitle" class="input w-full" placeholder="공지사항 제목을 입력하세요"/>
                </fieldset>
                <fieldset class="fieldset w-full">
                    <legend class="fieldset-legend">내용</legend>
                    <textarea id="inputContent" class="textarea w-full h-36" placeholder="공지사항 내용을 입력하세요"></textarea>
                </fieldset>
                <label class="label cursor-pointer gap-2 w-fit">
                    <input type="checkbox" id="inputPushNotificationEnabled" class="checkbox checkbox-primary checkbox-sm" checked/>
                    <span>전체 푸시 발송</span>
                </label>
                <div class="flex justify-end gap-2 mt-2">
                    <form method="dialog">
                        <button class="btn btn-ghost">취소</button>
                    </form>
                    <button class="btn btn-primary" onclick="createAnnouncement()">
                        <i data-lucide="send" class="size-4"></i>
                        전송
                    </button>
                </div>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- 공지사항 수정 모달 (푸시 재발송 없음) -->
    <dialog id="editModal" class="modal">
        <div class="modal-box w-full max-w-2xl">
            <h3 class="text-lg font-bold mb-1">공지사항 수정</h3>
            <p class="text-sm text-base-content/60 mb-5">수정 시 푸시 알림은 다시 발송되지 않습니다.</p>
            <input type="hidden" id="editAnnouncementId"/>
            <div class="flex flex-col gap-4">
                <fieldset class="fieldset w-full">
                    <legend class="fieldset-legend">제목</legend>
                    <input type="text" id="editTitle" class="input w-full"/>
                </fieldset>
                <fieldset class="fieldset w-full">
                    <legend class="fieldset-legend">내용</legend>
                    <textarea id="editContent" class="textarea w-full h-36"></textarea>
                </fieldset>
                <div class="flex justify-end gap-2 mt-2">
                    <form method="dialog">
                        <button class="btn btn-ghost">취소</button>
                    </form>
                    <button class="btn btn-primary" onclick="updateAnnouncement()">
                        <i data-lucide="save" class="size-4"></i>
                        저장
                    </button>
                </div>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- 삭제 확인 모달 -->
    <dialog id="deleteModal" class="modal">
        <div class="modal-box">
            <h3 class="text-lg font-bold mb-2">공지사항 삭제</h3>
            <p class="text-base-content/70">이 공지사항을 삭제하시겠습니까?</p>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-ghost">취소</button>
                </form>
                <button class="btn btn-error" onclick="confirmDelete()">삭제</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>
</div>

<th:block layout:fragment="js">
    <script>
        let currentPage = 0;
        const pageSize = 20;
        let pendingDeleteId = null;
        // 수정 모달 채우기용 (announcementId > 공지)
        let announcementById = {};

        document.addEventListener('DOMContentLoaded', function () {
            loadAnnouncements();
        });

        function loadAnnouncements() {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('emptyMessage').style.display = 'none';
            document.getElementById('paginationContainer').style.display = 'none';

            adminFetch.post('/api/admin/announcements/list', {
                pageNumber: currentPage,
                pageSize: pageSize,
            })
            .then(r => {
                if (!r.ok) throw new Error(String(r.status));
                return r.json();
            })
            .then(data => {
                if (data === null) return;
                renderAnnouncements(data);
            })
            .catch(e => {
                console.error('공지사항 로드 실패:', e);
                document.getElementById('loading').style.display = 'none';
            });
        }

        function renderAnnouncements(data) {
            const items = data.announcements || [];
            document.getElementById('totalCount').textContent = `총 ${(data.totalElements || 0).toLocaleString()}건`;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            announcementById = {};
            items.forEach(announcement => { announcementById[announcement.announcementId] = announcement; });

            if (items.length > 0) {
                tbody.innerHTML = items.map(a => {
                    const title = escapeHtml(a.title || '-');
                    const content = escapeHtml((a.content || '').substring(0, 60)) + (a.content && a.content.length > 60 ? '...' : '');
                    return `<tr class="hover">
                        <td class="max-w-48 truncate">${title}</td>
                        <td class="max-w-64 truncate">${content}</td>
                        <td class="text-sm">${TimeUtils.formatDate(a.createdDate)}</td>
                        <td>
                            <div class="flex gap-1">
                                <button class="btn btn-ghost btn-xs" title="수정" onclick="openEditModal('${escapeHtml(a.announcementId)}')">
                                    <i data-lucide="pencil" class="size-4"></i>
                                </button>
                                <button class="btn btn-ghost btn-xs text-error" title="삭제" onclick="openDeleteModal('${escapeHtml(a.announcementId)}')">
                                    <i data-lucide="trash-2" class="size-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
                }).join('');

                renderPagination(data);
                document.getElementById('tableContainer').style.display = 'block';
                document.getElementById('paginationContainer').style.display = 'flex';
            } else {
                document.getElementById('emptyMessage').style.display = 'flex';
            }

            document.getElementById('loading').style.display = 'none';
            lucide.createIcons();
        }

        function renderPagination(data) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            if (!data.totalPages || data.totalPages <= 1) return;

            const cur = data.currentPage;
            const total = data.totalPages;

            pagination.innerHTML += `<button class="join-item btn btn-sm ${cur === 0 ? 'btn-disabled' : ''}" onclick="changePage(${cur - 1})">&laquo;</button>`;

            const start = Math.max(0, cur - 2);
            const end = Math.min(total - 1, cur + 2);
            for (let i = start; i <= end; i++) {
                pagination.innerHTML += `<button class="join-item btn btn-sm ${i === cur ? 'btn-active' : ''}" onclick="changePage(${i})">${i + 1}</button>`;
            }

            pagination.innerHTML += `<button class="join-item btn btn-sm ${cur === total - 1 ? 'btn-disabled' : ''}" onclick="changePage(${cur + 1})">&raquo;</button>`;

            const pageStart = cur * pageSize + 1;
            const pageEnd = Math.min(pageStart + pageSize - 1, data.totalElements);
            document.getElementById('pageInfo').textContent = `${pageStart}-${pageEnd} / ${data.totalElements}`;
        }

        function changePage(page) {
            if (page < 0) return;
            currentPage = page;
            loadAnnouncements();
        }

        function createAnnouncement() {
            const title = document.getElementById('inputTitle').value.trim();
            const content = document.getElementById('inputContent').value.trim();

            const isPushNotificationEnabled = document.getElementById('inputPushNotificationEnabled').checked;

            if (!title || !content) {
                alert('제목과 내용을 모두 입력해주세요.');
                return;
            }
            // 푸시 발송 확인 (전체 회원 대상)
            if (isPushNotificationEnabled && !confirm('전체 회원에게 푸시가 발송됩니다. 계속할까요?')) return;

            AdminApi.call('/api/admin/announcements/create', {
                announcementTitle: title,
                announcementContent: content,
                isPushNotificationEnabled: String(isPushNotificationEnabled),
            })
            .then(() => {
                document.getElementById('createModal').close();
                document.getElementById('inputTitle').value = '';
                document.getElementById('inputContent').value = '';
                document.getElementById('inputPushNotificationEnabled').checked = true;
                currentPage = 0;
                loadAnnouncements();
            })
            .catch(e => AdminApi.alertError(e, '공지사항 작성'));
        }

        function openEditModal(announcementId) {
            const announcement = announcementById[announcementId];
            if (!announcement) return;
            document.getElementById('editAnnouncementId').value = announcementId;
            document.getElementById('editTitle').value = announcement.title || '';
            document.getElementById('editContent').value = announcement.content || '';
            document.getElementById('editModal').showModal();
        }

        function updateAnnouncement() {
            const title = document.getElementById('editTitle').value.trim();
            const content = document.getElementById('editContent').value.trim();
            if (!title || !content) {
                alert('제목과 내용을 모두 입력해주세요.');
                return;
            }

            AdminApi.call('/api/admin/announcements/update', {
                announcementId: document.getElementById('editAnnouncementId').value,
                announcementTitle: title,
                announcementContent: content,
            })
            .then(() => {
                document.getElementById('editModal').close();
                loadAnnouncements();
            })
            .catch(e => AdminApi.alertError(e, '공지사항 수정'));
        }

        function openDeleteModal(announcementId) {
            pendingDeleteId = announcementId;
            document.getElementById('deleteModal').showModal();
        }

        function confirmDelete() {
            if (!pendingDeleteId) return;

            adminFetch.post('/api/admin/announcements/delete', {
                announcementId: pendingDeleteId,
            })
            .then(r => {
                if (!r.ok) throw new Error(String(r.status));
                return r.json();
            })
            .then(data => {
                if (data !== null) {
                    document.getElementById('deleteModal').close();
                    pendingDeleteId = null;
                    loadAnnouncements();
                }
            })
            .catch(e => AdminApi.alertError(e, '공지사항 삭제'));
        }
    </script>
</th:block>
</body>
</html>
